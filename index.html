<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOPA GACHA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07030d;color:#fff;font-family:-apple-system,sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 50% 0,#351451,#10051d 38%,#07030d 75%);overflow:hidden}header{height:70px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900;letter-spacing:.13em;background:linear-gradient(90deg,#fff,#ffd45c,#ff4d9a);-webkit-background-clip:text;color:transparent}.stone{padding:8px 12px;border:1px solid #806b35;border-radius:99px;background:#ffffff12;font-weight:800}.plus{margin-left:8px;border:0;border-radius:50%;width:24px;height:24px;background:#ffd45c;font-weight:900}main{height:calc(100dvh - 70px);display:flex;flex-direction:column}.stat{padding:4px 18px;display:flex;justify-content:space-between;font-size:12px;color:#e5d6ff}.bar{width:130px;height:6px;margin-top:5px;background:#2b1740;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7545ff,#ff4d9a,#ffd45c);transition:.3s}.stage{flex:1;min-height:280px;display:grid;place-items:center}.orb{width:min(66vw,290px);height:min(66vw,290px);border:0;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fff 0 5%,transparent 6%),radial-gradient(circle at 50% 45%,#ff9bd8,#783dff 40%,#190722 72%);box-shadow:0 0 45px #d46bff,0 0 110px #6023b6}.spin{animation:spin .9s ease}.gold{background:radial-gradient(circle at 35% 28%,#fff 0 5%,transparent 6%),radial-gradient(circle at 50% 45%,#fff6bd,#e9a000 42%,#482200 72%);box-shadow:0 0 70px #ffd45c}.rainbow{background:conic-gradient(#ff4d9a,#ffd45c,#4dff97,#4df0ff,#8d4dff,#ff4d9a);box-shadow:0 0 70px #fff,0 0 150px #ff4d9a}@keyframes spin{0%{transform:scale(.7) rotate(0)}70%{transform:scale(1.15) rotate(540deg)}100%{transform:scale(1) rotate(720deg)}}.hint{text-align:center;color:#ffde90;font-size:13px;margin-top:-30px}.hud{padding:12px 16px 22px}.buttons{display:grid;grid-template-columns:1fr 1.35fr;gap:10px}.draw{border:0;border-radius:16px;padding:15px 5px;color:#fff;font-size:15px;font-weight:900}.draw small{display:block;font-size:10px;margin-top:4px}.one{background:#5424c7}.ten{background:linear-gradient(#ff6bb7,#c41569)}#modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:20px}#modal.show{display:grid}.sheet{width:min(90vw,400px);padding:24px 18px;border:1px solid #8b6c29;border-radius:22px;background:#1a0c29;text-align:center;box-shadow:0 0 70px #ff4d9a}.rank{display:inline-block;padding:8px 15px;border-radius:99px;font-weight:900}.N{background:#444}.R{background:#21549e}.SR{background:#6d3cff}.SSR{background:#d88a00;color:#211400}.UR{background:linear-gradient(90deg,#fff,#ffd45c,#ff4d9a);color:#21082a}.close{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;font-weight:900}
</style>
<body>
<header><div class="logo">DOPA GACHA</div><div class="stone">💎 <b id="s">3000</b><button class="plus" id="add">+</button></div></header>
<main>
<div class="stat"><div>天井まで <b id="p">80</b>連<div class="bar"><i id="b"></i></div></div><div>神引き指数<br><b id="l">0</b></div></div>
<div class="stage"><button class="orb" id="o"></button></div>
<div class="hint" id="h">中央のオーブをタップして召喚</div>
<div class="hud"><div class="buttons"><button class="draw one" id="one">単発<small>石 ×150</small></button><button class="draw ten" id="ten">10連召喚<small>石 ×1500</small></button></div></div>
</main>
<div id="modal"><div class="sheet"><p>SUMMON RESULT</p><h1 id="n"></h1><b class="rank" id="r"></b><br><button class="close" id="x">閉じる</button></div></div>
<script>
let s=3000,q=0,l=0,busy=0;const $=x=>document.getElementById(x);
function ui(){$("s").textContent=s;$("p").textContent=80-q%80;$("b").style.width=q%80/80*100+"%";$("l").textContent=l}
function roll(){let x=Math.random()*100;if(x<1)return["UR","原初の神核"];if(x<6)return["SSR","星海の歌姫"];if(x<20)return["SR","月光のドレス"];if(x<50)return["R","虹色の欠片"];return["N","普通の石ころ"]}
function go(k){if(busy)return;let c=k==10?1500:150;if(s<c){$("h").textContent="石が足りない！右上の＋で補充";return}busy=1;s-=c;let z=roll();q+=k;$("o").className="orb spin";$("h").textContent="運命、収束中……";ui();setTimeout(()=>{if(z[0]=="SR")$("o").className="orb gold";if(z[0]=="SSR"||z[0]=="UR")$("o").className="orb rainbow"},350);setTimeout(()=>{l+=z[0]=="UR"?777:z[0]=="SSR"?80:z[0]=="SR"?8:0;$("n").textContent=z[1];$("r").textContent=z[0];$("r").className="rank "+z[0];$("modal").className="show";$("o").className="orb";$("h").textContent="中央のオーブをタップして召喚";ui();busy=0},1000)}
$("o").onclick=()=>go(1);$("one").onclick=()=>go(1);$("ten").onclick=()=>go(10);$("add").onclick=()=>{s+=3000;ui()};$("x").onclick=()=>$("modal").className="";ui();
</script>
</body></html>
