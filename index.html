<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOPA GACHA</title>
<style>
:root{--bg:#08030e;--p:#ff4d9a;--g:#ffd45c;--v:#7040ff;--c:#4df0ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}body{min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% -10%,#42195d 0,#160721 42%,#08030e 82%)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}.logo{font-size:22px;font-weight:950;letter-spacing:.13em;background:linear-gradient(90deg,#fff,var(--g),var(--p));-webkit-background-clip:text;color:transparent}.right{display:flex;gap:7px;align-items:center}.pill{padding:7px 10px;border:1px solid #806b35;border-radius:999px;background:#ffffff14;font-weight:800;font-size:13px}.mini{height:31px;min-width:31px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font-weight:900}.plus{background:var(--g);color:#2c1900}main{height:calc(100dvh - 72px);display:flex;flex-direction:column}.status{display:flex;justify-content:space-between;padding:2px 18px;font-size:12px;color:#e6d7ff}.bar{width:145px;height:6px;margin-top:5px;border-radius:99px;overflow:hidden;background:#2b1740}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--v),var(--p),var(--g));transition:.35s}.stage{flex:1;min-height:255px;display:grid;place-items:center;position:relative}.orbwrap{position:relative;width:min(65vw,290px);height:min(65vw,290px)}.ring{position:absolute;inset:-20px;border:2px dashed #ffffff55;border-radius:50%;animation:rot 10s linear infinite}.ring.b{inset:-37px;border-color:#ffd45c66;animation-direction:reverse;animation-duration:17s}@keyframes rot{to{transform:rotate(360deg)}}.orb{width:100%;height:100%;border:0;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fff 0 5%,transparent 6%),radial-gradient(circle at 50% 45%,#ff9bd8,#783dff 42%,#170620 74%);box-shadow:0 0 45px #d46bff,0 0 120px #6023b6}.spin{animation:spin 1s ease}.gold{background:radial-gradient(circle at 35% 28%,#fff 0 5%,transparent 6%),radial-gradient(circle at 50% 45%,#fff5bd,#e9a000 42%,#482200 72%);box-shadow:0 0 75px var(--g),0 0 145px #ff9e00}.rainbow{background:conic-gradient(var(--p),var(--g),#4dff97,var(--c),#8d4dff,var(--p));box-shadow:0 0 70px #fff,0 0 170px var(--p)}@keyframes spin{0%{transform:scale(.65) rotate(0)}65%{transform:scale(1.16) rotate(540deg)}100%{transform:scale(1) rotate(720deg)}}.hint{position:absolute;bottom:5px;text-align:center;width:100%;font-size:13px;letter-spacing:.12em;color:#ffdf94}.hud{padding:12px 16px 21px;background:linear-gradient(transparent,#08030e 25%)}.tabs{display:flex;justify-content:center;gap:7px;margin-bottom:9px}.tabs span{font-size:10px;color:#dacaff;border:1px solid #493361;border-radius:99px;padding:5px 9px}.buttons{display:grid;grid-template-columns:1fr 1.35fr;gap:10px}.draw{border:0;border-radius:16px;padding:15px 5px;color:#fff;font-size:15px;font-weight:900}.draw small{display:block;margin-top:4px;font-size:10px}.one{background:linear-gradient(#7245ff,#35158c)}.ten{background:linear-gradient(#ff70bb,#bf1465)}#start,#modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#06030ddd;text-align:center}#modal{display:none;background:#000c}#modal.show{display:grid}.startbox,.sheet{width:min(92vw,470px);padding:25px 17px;border:1px solid #8b6c29;border-radius:23px;background:linear-gradient(#241133,#0d0715);box-shadow:0 0 85px #ff4d9a77}.startbox h1{margin:7px 0;font-size:27px}.startbox p{color:#d8c6ef;font-size:13px;line-height:1.7}.startbtn,.close{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,var(--p),var(--g));color:#260b20;font-weight:950;font-size:15px}.mute{margin-top:12px;border:0;background:none;color:#cbb9e7}.title{font-weight:900;letter-spacing:.2em;color:var(--g);font-size:13px}.best{margin:8px 0 14px;font-weight:900;font-size:18px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.card{min-height:88px;padding:6px 3px;border:1px solid #ffffff44;border-radius:9px;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:800;animation:flip .42s ease both}@keyframes flip{from{opacity:0;transform:scale(.25) rotateY(90deg)}to{opacity:1;transform:none}}.rank{font-size:10px;letter-spacing:.12em;opacity:.9}.name{margin-top:4px}.N{background:#3b3b45}.R{background:#21549e}.SR{background:#6d3cff;box-shadow:0 0 14px #9b75ff}.SSR{background:linear-gradient(#ffd45c,#a55a00);color:#2c1900;box-shadow:0 0 18px var(--g)}.UR{background:linear-gradient(135deg,#fff,var(--g),var(--p),var(--c));color:#21082a;box-shadow:0 0 25px #fff}.flash{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:9}.flash.on{animation:flash .35s ease}@keyframes flash{40%{opacity:1}100%{opacity:0}}
</style></head><body>
<audio id="bgm" loop preload="auto"><source src="gemini_music.mp3" type="audio/mpeg"></audio><div class="flash" id="flash"></div>
<div id="start"><div class="startbox"><div class="logo">DOPA GACHA</div><h1>神引きシミュレーター</h1><p>音ありで始めるとBGMと効果音が有効になります。<br>10連は10枚すべて順番にめくれます。</p><button class="startbtn" id="startbtn">▶ 音ありで始める</button><button class="mute" id="silent">音なしで始める</button></div></div>
<header><div class="logo">DOPA GACHA</div><div class="right"><button class="mini" id="sound">♪</button><div class="pill">💎 <b id="stones">3000</b></div><button class="mini plus" id="add">+</button></div></header>
<main><div class="status"><div>天井まで <b id="pity">80</b>連<div class="bar"><i id="bar"></i></div></div><div>神引き指数<br><b id="luck">0</b></div></div><div class="stage"><div class="orbwrap"><div class="ring"></div><div class="ring b"></div><button class="orb" id="orb"></button></div><div class="hint" id="hint">中央のオーブをタップして召喚</div></div><div class="hud"><div class="tabs"><span>金演出 SR以上</span><span>虹演出 SSR以上</span><span>10連 SR確定</span></div><div class="buttons"><button class="draw one" id="one">単発<small>石 ×150</small></button><button class="draw ten" id="ten">10連召喚<small>石 ×1500</small></button></div></div></main>
<div id="modal"><div class="sheet"><div class="title">10 PULL RESULT</div><div class="best" id="best"></div><div class="cards" id="cards"></div><button class="close" id="close">もう一度引く</button></div></div>
<script>
const $=x=>document.getElementById(x);let stones=3000,pulls=0,luck=0,busy=false,soundOn=true,ctx;const power={N:0,R:1,SR:2,SSR:3,UR:4};
function tone(f,d=.12,type='sine',v=.06){if(!soundOn)return;try{ctx=ctx||new AudioContext();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.stop(ctx.currentTime+d)}catch(e){}}
function ui(){$('stones').textContent=stones.toLocaleString();$('pity').textContent=80-pulls%80;$('bar').style.width=pulls%80/80*100+'%';$('luck').textContent=luck}
function roll(force){let n=Math.random()*100;if(n<.5)return['UR','原初の神核'];if(n<5)return['SSR','星海の歌姫'];if(n<18||force)return['SR','月光のドレス'];if(n<50)return['R','虹色の欠片'];return['N',['普通の石ころ','コンビニコーヒー','既読スルー'][Math.floor(Math.random()*3)]]}
function play(n){if(busy)return;let cost=n===10?1500:150;if(stones<cost){$('hint').textContent='石が足りない！右上の＋で無料補充';tone(140);return}busy=true;stones-=cost;let a=Array.from({length:n},()=>roll(false));if(n===10&&!a.some(x=>power[x[0]]>=2))a[9]=roll(true);pulls+=n;let best=a.reduce((x,y)=>power[y[0]]>power[x[0]]?y:x);$('orb').className='orb spin';$('hint').textContent='運命、収束中……';tone(180,.3,'sawtooth');ui();setTimeout(()=>{if(best[0]==='SR'){$('orb').className='orb gold';tone(660,.2)}if(power[best[0]]>=3){$('orb').className='orb rainbow';$('flash').className='flash on';[440,660,880].forEach((f,i)=>setTimeout(()=>tone(f,.2,'square'),i*90))}},350);setTimeout(()=>{luck+=best[0]==='UR'?777:best[0]==='SSR'?80:best[0]==='SR'?8:0;$('best').textContent='最高レア：'+best[0]+'　'+best[1];$('cards').innerHTML=a.map((x,i)=>'<div class="card '+x[0]+'" style="animation-delay:'+(i*.09)+'s"><div><div class="rank">'+x[0]+'</div><div class="name">'+x[1]+'</div></div></div>').join('');$('modal').className='show';$('orb').className='orb';$('hint').textContent='中央のオーブをタップして召喚';ui();busy=false},1150)}
function begin(audio){soundOn=audio;if(audio){$('bgm').volume=.35;$('bgm').play().catch(()=>{});tone(523,.15);setTimeout(()=>tone(659,.15),110)}$('start').style.display='none'}
$('startbtn').onclick=()=>begin(true);$('silent').onclick=()=>begin(false);$('one').onclick=()=>play(1);$('ten').onclick=()=>play(10);$('orb').onclick=()=>play(1);$('add').onclick=()=>{stones+=3000;ui();tone(880)};$('close').onclick=()=>{$('modal').className=''};$('sound').onclick=()=>{soundOn=!soundOn;$('bgm').muted=!soundOn;$('sound').textContent=soundOn?'♪':'×';if(soundOn)$('bgm').play().catch(()=>{})};ui();
</script></body></html>
