<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DOPA GACHA</title>

<style>
:root{
  --bg:#07030d;
  --pink:#ff4d9a;
  --gold:#ffd45c;
  --purple:#6d3cff;
  --cyan:#4df0ff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
}

body{
  min-height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%,#2c1243 0%,#10051d 38%,#07030d 75%);
}

header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:.13em;
  background:linear-gradient(90deg,#fff,var(--gold),var(--pink));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.stones{
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 10px 7px 13px;
  border:1px solid #765e2c;
  border-radius:999px;
  background:#ffffff12;
  font-weight:800;
}

.gem{
  width:17px;
  height:17px;
  transform:rotate(45deg);
  background:linear-gradient(135deg,var(--cyan),#527bff,#d04dff);
  box-shadow:0 0 16px var(--cyan);
}

.plus{
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:var(--gold);
  color:#321d00;
  font-size:18px;
  font-weight:900;
}

main{
  height:calc(100dvh - 72px);
  display:flex;
  flex-direction:column;
}

.status{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:4px 18px;
  color:#e3d3ff;
  font-size:12px;
}

.bar{
  width:135px;
  height:6px;
  margin-top:5px;
  border-radius:99px;
  overflow:hidden;
  background:#28143a;
}

.bar i{
  display:block;
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--purple),var(--pink),var(--gold));
  transition:.3s;
}

.stage{
  flex:1;
  min-height:290px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

.orb-wrap{
  width:min(66vw,300px);
  height:min(66vw,300px);
  position:relative;
}

.ring{
  position:absolute;
  inset:-20px;
  border:2px dashed #ffffff55;
  border-radius:50%;
  animation:rotate 11s linear infinite;
}

.ring.two{
  inset:-38px;
  border-color:#ffd45c66;
  animation-direction:reverse;
  animation-duration:17s;
}

@keyframes rotate{
  to{transform:rotate(360deg)}
}

.orb{
  width:100%;
  height:100%;
  border:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 34% 28%,#fff 0 5%,transparent 6%),
    radial-gradient(circle at 50% 45%,#ff9bd8 0%,#783dff 38%,#190722 72%);
  box-shadow:
    0 0 45px #d46bff,
    0 0 100px #6023b6,
    inset 0 -28px 50px #0008;
}

.orb.spin{
  animation:spin .9s ease-in-out;
}

.orb.gold{
  background:
    radial-gradient(circle at 34% 28%,#fff 0 5%,transparent 6%),
    radial-gradient(circle at 50% 45%,#fff4bd 0%,#e9a000 40%,#482200 72%);
  box-shadow:0 0 60px var(--gold),0 0 130px #ff9e00;
}

.orb.rainbow{
  background:conic-gradient(#ff4d9a,#ffd45c,#4dff97,#4df0ff,#8d4dff,#ff4d9a);
  box-shadow:0 0 70px #fff,0 0 150px
