<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DOPA GACHA — 神引きシミュレーター</title>
<style>
  :root {
    --bg: #050308;
    --gold: #f6d36a;
    --gold2: #ffefb0;
    --pink: #ff4d9a;
    --cyan: #4df0ff;
    --ur: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, #2a1038 0%, #050308 55%);
    color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    overflow: hidden;
  }
  body.shake { animation: shake .45s ease; }
  @keyframes shake {
    0%,100%{transform:translate(0,0)}
    10%{transform:translate(-8px,4px)}
    20%{transform:translate(7px,-6px)}
    30%{transform:translate(-6px,-3px)}
    40%{transform:translate(8px,5px)}
    50%{transform:translate(-4px,6px)}
    60%{transform:translate(5px,-4px)}
    70%{transform:translate(-7px,2px)}
    80%{transform:translate(3px,-5px)}
    90%{transform:translate(-2px,3px)}
  }
  #flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 40;
    opacity: 0; background: white;
  }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 35; overflow: hidden; }
  .spark {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: white; box-shadow: 0 0 10px currentColor;
    animation: spark .9s ease-out forwards;
  }
  @keyframes spark {
    to { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
  }
  .confetti {
    position: absolute; top: -10px; width: 8px; height: 14px;
    animation: fall 1.8s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .2; }
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 8px;
  }
  .logo {
    font-weight: 900; letter-spacing: .12em;
    background: linear-gradient(90deg, #fff, var(--gold), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-size: 18px;
  }
  .stones {
    display: flex; gap: 8px; align-items: center;
    background: rgba(255,255,255,.08); border: 1px solid rgba(246,211,106,.35);
    border-radius: 999px; padding: 6px 10px 6px 12px; font-weight: 700;
  }
  .gem { width: 16px; height: 16px; transform: rotate(45deg);
    background: linear-gradient(135deg, #7df, #4af, #a6f); box-shadow: 0 0 12px #4df; }
  button.plus {
    border: 0; background: var(--gold); color: #3a2500; font-weight: 900;
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  }
  .stage {
    height: calc(100% - 210px); display: grid; place-items: center; position: relative;
  }
  .orb-wrap { position: relative; width: min(78vw, 340px); height: min(78vw, 340px); }
  .orb {
    width: 100%; height: 100%; border-radius: 50%;
    background:
      radial-gradient(circle at 35% 28%, #fff 0 6%, transparent 7%),
      radial-gradient(circle at 50% 45%, #ff8ad4 0%, #6b2bff 42%, #12081c 72%);
    box-shadow: 0 0 40px #c46bff, 0 0 90px #4a1a88, inset 0 -30px 50px #0008;
    display: grid; place-items: center; position: relative; overflow: hidden;
    transition: transform .3s, filter .3s, box-shadow .3s;
  }
  .orb.spin { animation: spin 1.1s cubic-bezier(.2,.8,.2,1); }
  .orb.gold {
    background: radial-gradient(circle at 35% 28%, #fff 0 6%, transparent 7%),
      radial-gradient(circle at 50% 45%, #fff3b0 0%, #e8a000 40%, #4a2a00 72%);
    box-shadow: 0 0 50px #ffd24a, 0 0 120px #ff9a00;
  }
  .orb.rainbow {
    background: conic-gradient(from 0deg, #ff4d9a, #ffd24a, #4dff88, #4df0ff, #8a4dff, #ff4d9a);
    animation: hue 1.2s linear infinite, pulse 1s ease-in-out infinite;
    box-shadow: 0 0 70px #fff, 0 0 160px #ff4d9a;
  }
  .orb.void {
    background: radial-gradient(circle at 50% 50%, #000 0 35%, #fff 36% 37%, #000 45%);
    box-shadow: 0 0 80px #fff, 0 0 200px #88f;
    animation: voidpulse .6s ease-in-out infinite;
  }
  @keyframes spin { 0%{transform:scale(.7) rotate(0)} 60%{transform:scale(1.12) rotate(540deg)} 100%{transform:scale(1) rotate(720deg)} }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes voidpulse { 50% { transform: scale(1.15); } }
  .rings {
    position: absolute; inset: -18px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.25); animation: rot 12s linear infinite;
    pointer-events: none;
  }
  .rings:nth-child(2) { inset: -34px; animation-duration: 18s; animation-direction: reverse; border-color: rgba(246,211,106,.35); }
  @keyframes rot { to { transform: rotate(360deg); } }
  .hint {
    position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
    color: #ffd98a; font-size: 13px; letter-spacing: .3em; opacity: .85;
  }
  .pity {
    position: absolute; top: 6px; left: 18px; right: 18px;
    display: flex; justify-content: space-between; font-size: 12px; color: #d7c6ff;
  }
  .bar { height: 6px; background: #1b1224; border-radius: 99px; overflow: hidden; margin-top: 6px; flex: 1; margin-left: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8a4dff, #ff4d9a, #ffd24a); transition: width .35s; }
  .hud {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 12px 16px 22px;
    background: linear-gradient(180deg, transparent, #050308 28%);
  }
  .btns { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
  .btn {
    border: 0; cursor: pointer; border-radius: 16px; padding: 16px 10px;
    font-weight: 900; letter-spacing: .08em; font-size: 15px; color: #fff;
    position: relative; overflow: hidden;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .single { background: linear-gradient(180deg, #6a3cff, #3a1488); box-shadow: 0 8px 24px #3a148899; }
  .multi { background: linear-gradient(180deg, #ff6ab5, #c2146a); box-shadow: 0 8px 24px #c2146a88; }
  .btn small { display: block; font-weight: 600; opacity: .85; letter-spacing: 0; margin-top: 4px; font-size: 11px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .tab {
    flex: 1; border: 1px solid #3a2a55; background: #12081c; color: #cbb8ff;
    border-radius: 999px; padding: 8px; cursor: pointer; font-size: 12px; font-weight: 700;
  }
  .tab.on { background: #2a1648; color: var(--gold); border-color: var(--gold); }
  #overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(0,0,0,.72); backdrop-filter: blur(6px);
    align-items: center; justify-content: center; padding: 18px;
  }
  #overlay.show { display: flex; }
  .sheet {
    width: min(92vw, 520px); max-height: 86vh; overflow: auto;
    background: linear-gradient(180deg, #1a1028, #0b0612);
    border: 1px solid #6a4a22; border-radius: 22px; padding: 18px;
    box-shadow: 0 0 80px #ff4d9a55;
  }
  .title-line { text-align: center; font-size: 13px; letter-spacing: .4em; color: var(--gold); margin-bottom: 8px; }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .card {
    aspect-ratio: 3/4; border-radius: 10px; display: grid; place-items: center;
    text-align: center; padding: 6px; font-size: 11px; font-weight: 800;
    border: 1px solid #333; background: #16101f; transform: scale(.2) rotateY(90deg);
    animation: reveal .45s cubic-bezier(.2,1.4,.3,1) forwards;
    position: relative; overflow: hidden;
  }
  @keyframes reveal { to { transform: scale(1) rotateY(0); } }
  .card .rk { font-size: 10px; letter-spacing: .15em; opacity: .9; }
  .card .nm { font-size: 12px; margin-top: 4px; }
  .n { background: linear-gradient(180deg,#3a3a44,#1c1c22); }
  .r { background: linear-gradient(180deg,#2a4a88,#122244); box-shadow: 0 0 16px #4af6; }
  .sr { background: linear-gradient(180deg,#7a4cff,#2a1058); box-shadow: 0 0 18px #a46bff; }
  .ssr { background: linear-gradient(180deg,#ffd24a,#a45a00); color: #3a2200; box-shadow: 0 0 24px #ffd24a; }
  .ur {
    background: linear-gradient(135deg,#fff,#ffd24a,#ff4d9a,#4df0ff,#fff);
    color: #1a0820; box-shadow: 0 0 30px #fff; animation: hue 2s linear infinite;
  }
  .god { outline: 2px solid #fff; animation: pulse .7s ease-in-out infinite; }
  .close {
    width: 100%; margin-top: 14px; border: 0; border-radius: 12px; padding: 12px;
    background: #fff; color: #111; font-weight: 900; cursor: pointer;
  }
  .skip {
    position: absolute; top: 12px; right: 12px; border: 0; background: #ffffff22;
    color: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 12px;
  }
  .banner {
    text-align: center; margin-top: 4px; font-size: 22px; font-weight: 900;
  }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0 14px; font-size: 11px; color: #d7c6ff; }
  .chip { background: #ffffff10; border-radius: 99px; padding: 4px 8px; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gitem {
    background: #160e22; border: 1px solid #3a2a55; border-radius: 12px; padding: 10px;
    display: flex; justify-content: space-between; align-items: center; font-size: 13px;
  }
  .toast {
    position: fixed; top: 58px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(90deg,#ff4d9a,#ffd24a); color: #1a0820;
    font-weight: 900; padding: 8px 14px; border-radius: 99px; z-index: 60;
    opacity: 0; pointer-events: none; transition: .3s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .prod {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 28px; font-weight: 900; letter-spacing: .3em; text-shadow: 0 0 24px #fff;
    opacity: 0; pointer-events: none; z-index: 5;
  }
  .prod.on { animation: prod 1s ease forwards; }
  @keyframes prod { 0%{opacity:0;transform:scale(.6)} 30%{opacity:1;transform:scale(1.15)} 100%{opacity:0;transform:scale(1.4)} }
  .rates { font-size: 11px; color: #b9a8d8; line-height: 1.7; }
</style>
</head>
<body>
<div id="flash"></div>
<div id="fx"></div>
<div class="toast" id="toast"></div>
<header>
  <div class="logo">DOPA GACHA</div>
  <div class="stones"><span class="gem"></span>
