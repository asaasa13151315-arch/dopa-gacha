<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOPA GACHA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,sans-serif;background:#08030e;color:#fff}body{min-height:100dvh;background:radial-gradient(circle at 50% 0,#391653,#12071d 40%,#08030e 80%);overflow:hidden}header{height:68px;padding:15px 17px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:900;letter-spacing:.12em;background:linear-gradient(90deg,#fff,#ffd45c,#ff4d9a);-webkit-background-clip:text;color:transparent}.stone{padding:7px 10px;border:1px solid #806b35;border-radius:99px;background:#ffffff14;font-weight:800}.plus{margin-left:7px;width:23px;height:23px;border:0;border-radius:50%;background:#ffd45c;font-weight:900}main{height:calc(100dvh - 68px);display:flex;flex-direction:column}.status{padding:5px 18px;display:flex;justify-content:space-between;font-size:12px;color:#e6d6ff}.bar{width:130px;height:6px;margin-top:5px;border-radius:9px;background:#2a1740;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#7144ff,#ff4d9a,#ffd45c);transition:.3s}.stage{flex:1;min-height:270px;display:grid;place-items:center}.orb{width:min(64vw,280px);height:min(64vw,280px);border:0;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fff 0 5%,transparent 6%),radial-gradient(circle at 50% 45%,#ff9bd8,#783dff 42%,#170620 74%);box-shadow:0 0 45px #d46bff,0 0 115px #6023b6}.spin{animation:spin .9s ease}.gold{background:radial-gradient(circle at 35% 28%,#fff 0 5%,transparent 6%),radial-gradient(circle at 50% 45%,#fff5bd,#e9a000 42%,#482200 72%);box-shadow:0 0 75px #ffd45c}.rainbow{background:conic-gradient(#ff4d9a,#ffd45c,#4dff97,#4df0ff,#8d4dff,#ff4d9a);box-shadow:0 0 70px #fff,0 0 160px #ff4d9a}@keyframes spin{0%{transform:scale(.7) rotate(0)}65%{transform:scale(1.14) rotate(540deg)}100%{transform:scale(1) rotate(720deg)}}.hint{text-align:center;margin-top:-25px;color:#ffde90;font-size:13px}.hud{padding:12px 16px 21px}.buttons{display:grid;grid-template-columns:1fr 1.35fr;gap:10px}.draw{border:0;border-radius:16px;padding:15px 5px;color:#fff;font-size:15px;font-weight:900}.draw small{display:block;margin-top:4px;font-size:10px}.one{background:#5424c7}.ten{background:linear-gradient(#ff6bb7,#c41569)}#modal{display:none;position:fixed;inset:0;z-index:5;place-items:center;padding:15px;background:#000c}#modal.show{display:grid}.sheet{width:min(95vw,460px);max-height:88dvh;overflow:auto;padding:18px 13px;border:1px solid #8b6c29;border-radius:22px;background:linear-gradient(#21102f,#0d0715);text-align:center;box-shadow:0 0 75px #ff4d9a}.title{font-size:14px;font-weight:900;letter-spacing:.2em;color:#ffd45c}.best{margin:7px;font-size:18px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.card{min-height:86px;padding:6px 3px;border:1px solid #ffffff44;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;animation:card .35s ease both}@keyframes card{from{transform:scale(.2) rotateY(90deg);opacity:0}to{transform:scale(1);opacity:1}}.rank{font-size:10px;letter-spacing:.1em;opacity:.9}.name{margin-top:4px}.N{background:#3b3b45}.R{background:#21549e}.SR{background:#6d3cff;box-shadow:0 0 14px #9b75ff}.SSR{background:linear-gradient(#ffd45c,#a55a00);color:#2c1900;box-shadow:0 0 18px #ffd45c}.UR{background:linear-gradient(135deg,#fff,#ffd45c,#ff4d9a,#4df0ff);color:#21082a;box-shadow:0 0 25px #fff}.close{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:#fff;color:#15091e;font-weight:900}
</style>
<body>
<header><div class="logo">DOPA GACHA</div><div class="stone">💎 <b id="s">3000</b><button class="plus" id="add">+</button></div></header>
<main><div class="status"><div>天井まで <b id="p">80</b>連<div class="bar"><i id="b"></i></div></div><div>神引き指数<br><b id="l">0</b></div></div><div class="stage"><button class="orb" id="o"></button></div><div class="hint" id="h">中央のオーブをタップして召喚</div><div class="hud"><div class="buttons"><button class="draw one" id="one">単発<small>石 ×150</small></button><button class="draw ten" id="ten">10連召喚<small>石 ×1500　SR以上確定</small></button></div></div></main>
<div id="modal"><div class="sheet"><div class="title">SUMMON RESULT</div><div class="best" id="best"></div><div class="cards" id="cards"></div><button class="close" id="x">閉じる</button></div></div>
<script>
const $=x=>document.getElementById(x);let s=3000,q=0,l=0,busy=0;
function ui(){$("s").textContent=s.toLocaleString();$("p").textContent=80-q%80;$("b").style.width=q%80/80*100+"%";$("l").textContent=l}
function roll(min){let x=Math.random()*100;if(x<.5)return["UR","原初の神核"];if(x<5)return["SSR","星海の歌姫"];if(x<18||min)return["SR","月光のドレス"];if(x<50)return["R","虹色の欠片"];return["N",["普通の石ころ","コンビニコーヒー","既読スルー"][Math.floor(Math.random()*3)]]}
function go(n){if(busy)return;let c=n==10?1500:150;if(s<c){$("h").textContent="石が足りない！右上の＋で無料補充";return}busy=1;s-=c;let a=[];for(let i=0;i<n;i++)a.push(roll(0));if(n==10&&!a.some(v=>["SR","SSR","UR"].includes(v[0])))a[9]=roll(1);q+=n;let z=a.reduce((u,v)=>"NRSSSRUR".indexOf(v[0])>"NRSSSRUR".indexOf(u[0])?v:u);$("o").className="orb spin";$("h").textContent="運命、収束中……";ui();setTimeout(()=>{$("o").className="orb "+(z[0]=="SR"?"gold":z[0]=="SSR"||z[0]=="UR"?"rainbow":"")},350);setTimeout(()=>{l+=z[0]=="UR"?777:z[0]=="SSR"?80:z[0]=="SR"?8:0;$("best").textContent="最高レア："+z[0]+"　"+z[1];$("cards").innerHTML=a.map((v,i)=>`<div class="card ${v[0]}" style="animation-delay:${i*.07}s"><div><div class="rank">${v[0]}</div><div class="name">${v[1]}</div></div></div>`).join("");$("modal").className="show";$("o").className="orb";$("h").textContent="中央のオーブをタップして召喚";ui();busy=0},1050)}
$("o").onclick=()=>go(1);$("one").onclick=()=>go(1);$("ten").onclick=()=>go(10);$("add").onclick=()=>{s+=3000;ui()};$("x").onclick=()=>$("modal").className="";ui();
</script></body></html>
